version: '3.3'

services:
  app:
    container_name: tastetable-app
    build: .
    ports:
      - "3003:3003"  # Updated to match the environment PORT set to 3003
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://mongo:27017/taste-table
      - API_URL=http://mongo
      - ACCESS_TOKEN_KEY=MyVeryVeryAccessTokenKey
      - ACCESS_TOKEN_TIME=15h
      - REFRESH_TOKEN_KEY=MyVeryVeryRefreshTokenKey
      - REFRESH_TOKEN_TIME=15d
      - REFRESH_TIME_MS=84600000
    depends_on:
      - mongo
    restart: always  # Ensures the app restarts if it crashes

  mongo:
    image: mongo:latest
    container_name: tastetable-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always  # Ensures MongoDB restarts if it stops unexpectedly

volumes:
  mongo-data:
